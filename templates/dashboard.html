{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="welcome-box">

        <h1>
            Welcome, {{ name }} 👋
        </h1>

        <p>
            Manage your hospital appointments easily.
        </p>

    </div>


    <div class="row mt-4">

        <div class="col-md-4">

            <div class="card p-4">

                <h4>Find Doctor</h4>

                <p>
                    Search doctors by department.
                </p>

                <a
                href="{{ url_for('hospitals') }}"
                class="btn btn-primary">

                Search

                </a>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card p-4">

                <h4>My Appointments</h4>

                <p>
                    View your upcoming appointments.
                </p>

                <a
                href="{{ url_for('my_appointments') }}"
                class="btn btn-success">

                View

                </a>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card p-4">

                <h4>AI Assistant</h4>

                <p>
                    Ask AI to help find a doctor.
                </p>

                <a
                href="{{ url_for('ai_assistant') }}"
                class="btn btn-warning">

                Ask AI

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
