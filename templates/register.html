{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="form-container">

        <h2>Create Account</h2>

        <form method="POST">

            <input
                type="text"
                name="name"
                class="form-control mb-3"
                placeholder="Full Name"
                required>

            <input
                type="email"
                name="email"
                class="form-control mb-3"
                placeholder="Email"
                required>

            <input
                type="text"
                name="phone"
                class="form-control mb-3"
                placeholder="Phone Number"
                required>

            <input
                type="password"
                name="password"
                class="form-control mb-3"
                placeholder="Password"
                required>

            <button
                class="btn btn-success w-100">

                Register

            </button>

        </form>

    </div>

</div>

{% endblock %}
