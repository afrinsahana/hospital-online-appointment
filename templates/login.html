{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="form-container">

        <h2>Patient Login</h2>

        <form method="POST">

            <input
                type="email"
                name="email"
                class="form-control mb-3"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                class="form-control mb-3"
                placeholder="Password"
                required>

            <button
                class="btn btn-primary w-100">

                Login

            </button>

        </form>

        <p class="mt-3">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
